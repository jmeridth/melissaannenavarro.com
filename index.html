<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melissa Anne Navarro - Memorial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
        }

        .image-placeholder {
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
            background-color: #e0e0e0;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        .memorial-text {
            font-size: 24px;
            line-height: 1.6;
            color: #333;
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .dates {
            font-size: 24px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-placeholder" role="img" aria-label="Photo placeholder for Melissa Anne Navarro">
            Image will be added later
        </div>
        <div class="memorial-text">
            <h1 class="name">Melissa Anne Navarro</h1>
            <p class="dates">2/2/1978 - 4/23/2024</p>
        </div>
    </div>
</body>
</html>
